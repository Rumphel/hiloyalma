<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8b3a3a" />
  <title>Sin conexión | Hilo y Alma</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #efe6d6;
      color: #2b241e;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    .mark { font-size: 40px; color: #8b3a3a; }
    h1 { margin: 8px 0 12px; font-size: 24px; }
    p { margin: 0 0 20px; line-height: 1.5; color: #6a5f52; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a, button {
      font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
      padding: 10px 18px; border-radius: 8px; border: 2px solid #8b3a3a;
    }
    button { background: #8b3a3a; color: #f6f1e7; }
    a { color: #8b3a3a; background: transparent; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✳</div>
    <h1>Sin conexión</h1>
    <p>Esta página todavía no está guardada en tu dispositivo. Las colecciones y piezas que ya visitaste siguen disponibles. Para ver lo demás, vuelve a conectarte.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Reintentar</button>
      <a href="/">Ir al inicio</a>
    </div>
  </main>
  <script>
    window.addEventListener('online', () => location.reload())
  </script>
</body>
</html>
